name: paper-trade
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
concurrency: repo-writes
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python paper.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add paper
          git commit -m "paper update" || echo "no changes"
          git pull --rebase
          git push
